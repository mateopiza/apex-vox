name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: development
      ALLOWED_HOSTS: "*"
      GROQ_API_KEY: gsk_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -c requirements.lock -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: development
      ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies and Chromium
        run: |
          pip install -c requirements.lock -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Run browser journeys
        run: python -m pytest tests/e2e -q -rs

      - name: Upload screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: test-results/e2e/
          retention-days: 7

  frontend:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        run: |
          find app/static/js extension -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t apex-vox:ci .
      - name: Start the image and wait for its health check
        run: |
          docker run -d --name apex-vox-smoke -e ENVIRONMENT=development -e GROQ_API_KEY=gsk_ci_placeholder apex-vox:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' apex-vox-smoke)"
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          docker logs apex-vox-smoke
          exit 1
